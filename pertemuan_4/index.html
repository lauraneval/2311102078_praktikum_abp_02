<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Praktikum ABP AJAX</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #f5f0e8;
      --ink:   #1a1714;
      --rust:  #c0392b;
      --gold:  #c9972b;
      --line:  rgba(26,23,20,.15);
    }

    body {
      font-family: 'IBM Plex Mono', monospace;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background-image: repeating-linear-gradient(
        transparent,
        transparent 31px,
        var(--line) 31px,
        var(--line) 32px
      );
      background-size: 100% 32px;
    }

    .sheet {
      background: var(--cream);
      width: 100%;
      max-width: 560px;
      padding: 3rem 2.8rem;
      border: 1px solid rgba(26,23,20,.25);
      box-shadow: 5px 5px 0 rgba(26,23,20,.12);
      position: relative;
    }

    .sheet::before {
      content: '';
      position: absolute;
      left: 60px; top: 0; bottom: 0;
      width: 1px;
      background: rgba(192,57,43,.35);
    }

    .hole {
      position: absolute;
      left: 22px;
      width: 16px; height: 16px;
      border-radius: 50%;
      border: 1px solid rgba(26,23,20,.2);
      background: var(--cream);
      box-shadow: inset 0 0 3px rgba(0,0,0,.1);
    }
    .hole:nth-child(1) { top: 60px; }
    .hole:nth-child(2) { top: 50%; transform: translateY(-50%); }
    .hole:nth-child(3) { bottom: 60px; }

    .tag {
      font-size: .65rem;
      letter-spacing: .12em;
      color: var(--rust);
      text-transform: uppercase;
      margin-bottom: 1.6rem;
      display: flex;
      align-items: center;
      gap: .6rem;
    }
    .tag::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--rust);
      opacity: .4;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -.04em;
      margin-bottom: .3rem;
    }
    h1 span { color: var(--rust); }

    .sub {
      font-size: .72rem;
      color: rgba(26,23,20,.45);
      margin-bottom: 2.4rem;
      letter-spacing: .04em;
    }

    .req-line {
      display: flex;
      align-items: center;
      gap: .8rem;
      background: var(--ink);
      color: var(--cream);
      padding: .75rem 1rem;
      margin-bottom: 2rem;
      font-size: .78rem;
      cursor: pointer;
      border: none;
      width: 100%;
      text-align: left;
      font-family: 'IBM Plex Mono', monospace;
      position: relative;
      overflow: hidden;
    }

    .req-line::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--rust);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .45s ease;
      z-index: 0;
    }
    .req-line.fired::after { transform: scaleX(1); }
    .req-line span { position: relative; z-index: 1; }

    .prompt-sign { color: var(--gold); font-weight: 700; font-size: .9rem; }

    .cursor {
      display: inline-block;
      width: 7px; height: 14px;
      background: var(--cream);
      vertical-align: middle;
      animation: blink .9s step-start infinite;
      margin-left: 2px;
    }
    @keyframes blink { 50% { opacity: 0; } }

    #hasil-profil { min-height: 80px; font-size: .78rem; }

    .output-block { animation: fadeSlide .4s ease forwards; }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: none; }
    }

    .out-header {
      display: flex;
      align-items: center;
      gap: .5rem;
      font-size: .62rem;
      letter-spacing: .1em;
      color: rgba(26,23,20,.4);
      text-transform: uppercase;
      margin-bottom: .9rem;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #27ae60; }

    .field-row {
      display: grid;
      grid-template-columns: 90px 1fr;
      gap: .3rem .5rem;
      padding: .4rem 0;
      border-bottom: 1px dashed rgba(26,23,20,.12);
      align-items: baseline;
    }
    .field-row:last-of-type { border-bottom: none; }

    .field-key { color: rgba(26,23,20,.45); font-size: .7rem; }
    .field-val {
      font-size: .85rem;
      font-weight: 500;
      color: var(--ink);
      font-family: 'Space Grotesk', sans-serif;
    }

    .plain-out {
      margin-top: 1.2rem;
      padding: .7rem .9rem;
      border-left: 3px solid var(--rust);
      font-size: .72rem;
      color: var(--rust);
      background: rgba(192,57,43,.05);
      letter-spacing: .02em;
      line-height: 1.5;
    }

    .err-block {
      font-size: .78rem;
      color: var(--rust);
      display: flex;
      gap: .5rem;
      align-items: flex-start;
      animation: fadeSlide .3s ease forwards;
    }

    .stamp {
      margin-top: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--line);
      padding-top: 1rem;
    }
    .foot { font-size: .62rem; color: rgba(26,23,20,.35); letter-spacing: .08em; }
    .sigil {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: .72rem;
      color: var(--rust);
      border: 1.5px solid var(--rust);
      padding: .2rem .5rem;
      letter-spacing: .05em;
      opacity: .7;
      transform: rotate(-1.5deg);
      display: inline-block;
    }
  </style>
</head>
<body>

<div class="sheet">
  <div class="hole"></div>
  <div class="hole"></div>
  <div class="hole"></div>

  <div class="tag">Praktikum ABP &mdash; AJAX</div>

  <h1>fetch<span>()</span><br/>demo.</h1>
  <p class="sub">GET &rarr; data.php &rarr; parse JSON &rarr; inject DOM <br> <br> Mengambil data dari server menggunakan AJAX (fetch), memproses response dalam format JSON, lalu menampilkan hasilnya ke dalam DOM tanpa melakukan reload halaman.</p>

  <button class="req-line" id="btn-ambil" onclick="ambilData()">
    <span class="prompt-sign">$</span>
    <span id="btn-text">fetch('data.php')</span>
    <span class="cursor"></span>
  </button>

  <div id="hasil-profil"></div>

  <div class="stamp">
    <span class="foot">Naufal Thoriq Muzhaffar &nbsp;&bull;&nbsp; NIM 2311102078</span>
    <span class="sigil">NTM</span>
  </div>
</div>

<script>
  function ambilData() {
    const btn    = document.getElementById('btn-ambil');
    const txtEl  = document.getElementById('btn-text');
    const output = document.getElementById('hasil-profil');

    btn.classList.add('fired');
    txtEl.textContent = 'connecting...';

    fetch('data.php')
      .then(res => {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(data => {
        txtEl.textContent = '200 OK \u2014 data.php';

        const plain = `Nama: ${data.nama} | Pekerjaan: ${data.pekerjaan} | Lokasi: ${data.lokasi}`;

        output.innerHTML = `
          <div class="output-block">
            <div class="out-header">
              <span class="status-dot"></span>
              response &bull; application/json
            </div>
            <div class="field-row">
              <span class="field-key">nama</span>
              <span class="field-val">${data.nama}</span>
            </div>
            <div class="field-row">
              <span class="field-key">pekerjaan</span>
              <span class="field-val">${data.pekerjaan}</span>
            </div>
            <div class="field-row">
              <span class="field-key">lokasi</span>
              <span class="field-val">${data.lokasi}</span>
            </div>
            <div class="plain-out">${plain}</div>
          </div>
        `;
      })
      .catch(err => {
        btn.classList.remove('fired');
        txtEl.textContent = "fetch('data.php')";
        output.innerHTML = `<div class="err-block">
          <span>&#x26A0;</span>
          <span>Error: ${err.message} &mdash; pastiin server PHP jalan dulu ya.</span>
        </div>`;
      });
  }
</script>

</body>
</html>
